name: Regenerate profile

on:
  push:
    paths:
      - "profile/status.toml"
      - "scripts/regenerate_profile.py"
      - ".github/workflows/regenerate-profile.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-regeneration
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Regenerate dynamic profile blocks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/regenerate_profile.py

      - name: Commit regenerated README when changed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh generated profile status"
          git push
